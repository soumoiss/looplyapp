name: Verify Looply

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse browser modules
        run: |
          node --check scripts/build.mjs
          node --check scripts/audit-legacy-archive.mjs
          node --check src/supabase.js
          node --check src/identities.js
          node --check src/profiles.js
          node --check src/social.js
          node --check src/stories.js
          node --check src/music.js
          node --check src/chat.js
          node --check src/admin.js
          node --check src/archive-import.js
          node --check src/archived-cards.js
          node --check src/date-parser.js
          node --check src/gallery-archive.js
          node --check src/page-runtime.js
          node --check src/login.js
          node --check src/theme.js
          node --check src/youtube-playlist.js
          node --check assets/js/admin.js
          node --check assets/js/chat.js
          node --check assets/js/gallery.js
          node --check assets/js/home.js
          node --check assets/js/login.js
          node --check assets/js/music.js
          node --check assets/js/profile.js
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Functions
        run: |
          deno check --no-lock --config supabase/functions/looply-admin/deno.json supabase/functions/looply-admin/index.ts
          deno check --no-lock --config supabase/functions/looply-chat/deno.json supabase/functions/looply-chat/index.ts
          deno check --no-lock --config supabase/functions/looply-stories-cleanup/deno.json supabase/functions/looply-stories-cleanup/index.ts
      - name: Build static site
        run: npm run build
      - name: Run security contract tests
        run: npm test
